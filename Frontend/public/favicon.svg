<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="checkCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Calendar Base Card -->
  <rect x="5" y="9" width="54" height="50" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Calendar Colored Header -->
  <path d="M5 22 C5 14.82 10.82 9 18 9 H46 C53.18 9 59 14.82 59 22 V23 H5 Z" fill="url(#calHeader)"/>

  <!-- Binder Rings / Pins -->
  <rect x="17" y="3.5" width="6" height="11" rx="3" fill="#0f172a"/>
  <rect x="41" y="3.5" width="6" height="11" rx="3" fill="#0f172a"/>

  <!-- Subtle Calendar Grid Lines -->
  <line x1="12" y1="30" x2="22" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="30" x2="52" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Green Attendance Verified / Present Badge -->
  <circle cx="32" cy="41" r="14.5" fill="url(#checkCircle)" filter="url(#softShadow)"/>

  <!-- Bold White Attendance Checkmark -->
  <path d="M25 41 L29.8 45.8 L39 36" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
